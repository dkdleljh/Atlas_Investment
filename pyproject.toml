[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-investment"
version = "0.1.1"
description = "Atlas Investment paper trading engine for Korea and US markets."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pygount>=3.2",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[project.scripts]
atlas-investment = "atlas_investment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
